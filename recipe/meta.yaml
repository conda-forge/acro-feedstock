{% set name = "acro" %}
{% set version = "1.1.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d807c830f50499d67bf1354b6353e513f41ad401bfd06fc8170e381396758dc2

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - pip
  run:
    - python >={{ python_min }}
    - lifelines
    - lxml
    - matplotlib-base
    - numpy
    - openpyxl
    - pandas <=2.3.3
    - PyYAML
    - statsmodels
    - rdflib
    - tabulate

test:
  imports:
    - acro
  commands:
    - pip check
    - python -c "from acro import ACRO; ACRO()"
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/AI-SDC/ACRO
  summary: "Tools for the Semi-Automatic Checking of Research Outputs"
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rpreen
    - jim-smith
    - JessUWE
